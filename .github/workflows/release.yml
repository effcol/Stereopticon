name: Release

# Push a version tag (e.g. v0.1.0) to build the Windows installer and the
# portable zip and attach them to a draft GitHub release for that tag.
# The tag must match "version" in package.json. Review the draft, write
# the release notes, then publish it from the Releases page.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - name: Build and upload to a draft release
        run: npm run dist -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Keep the build as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: stereopticon-windows
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error
